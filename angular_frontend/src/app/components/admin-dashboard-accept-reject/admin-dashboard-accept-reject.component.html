<h2 class="text-center">{{"admin-dashboard-accommodations.approve_reject_title" | translate}}</h2>

<div *ngIf="isLoading" class="flex justify-center items-center min-h-screen">
  <div class="flex justify-center items-center h-full">
      <div class="loader"></div>
  </div>
</div>

<section *ngIf="allPendingAccommodations && allPendingAccommodations.length > 0; else noAccommodations" class="flex justify-center items-center pt-8">
    <div class="container p-5 text-center">
      <app-accommodation-cards [accommodations$]="pendingAccommodations$" [pageNumber]="pendingAccommodationsPageNumber" [totalPages]="pendingAccommodationsTotalPages"  [status]="'pending'"
        (askForPage)="loadPendingAccommodationsPage($event)" (refresh)="refresh($event)"></app-accommodation-cards>
    </div>
</section>

<ng-template #noAccommodations>
    <p>{{"accommodations_cards.notFound" | translate}}</p>
</ng-template>
