<div class="flex flex-col items-center align-middle" *ngIf="!errorUnauthorizedAccess && !errorNoUserEmailProvided">
    <form #resetPasswordForm="ngForm" (ngSubmit)="resetPassword()">
        <div class="flex flex-col items-start">
            <label class="label-primary" for="input-field">{{"reset-password-by-user-landing-page.password-label"}}:</label>
            <input class="mt-1 input-primary" id="input-field" name="passwordInput" #passwordInputField type="text" [(ngModel)]="inputField" />
        </div>

        <div id="button-container" class="mt-6 text-center">
            <button type="submit" class="btn-primary">{{"reset-password-by-user-landing-page.confirm" | translate}}</button>
        </div>
    </form>
</div>

<ng-container id="messages-container" *ngIf="thereAreMessages" class="mt-16">
    <button class="btn-primary w-fit" type="button" (click)="clearMessages()">{{"reset-password-by-user-landing-page.clear-messages" | translate}}</button>
    <br>
    <h1 class="text-xl text-blue-800" *ngIf="errorUserNotFoundAfterRequest">
        {{"reset-password-by-user-landing-page.user-not-found-error" | translate}}
    </h1>

    <h1 class="text-xl text-blue-800" *ngIf="successPasswordUpdated">
        {{"reset-password-by-user-landing-page.password-updated-success" | translate}}
    </h1>
</ng-container>
